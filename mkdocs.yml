site_name: ISXOgre Documentation
site_url: https://kannkor.github.io/ISXOgre/
repo_url: https://github.com/Kannkor/ISXOgre
repo_name: Kannkor/ISXOgre

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - EQ2:
    - EQ2/index.md
    - Getting Started:
      - Why OgreBot?: EQ2/getting-started/why-ogrebot.md
      - Installation: EQ2/getting-started/installation.md
      - Auto-Loading ISXOgre: EQ2/getting-started/auto-loading.md
