      - FAQ: EQ2/getting-started/faq.md
      - Connecting Computers: EQ2/getting-started/connect-computers.md
      - Copy from Console: EQ2/getting-started/copy-from-console.md
      - Remove FPS Display: EQ2/getting-started/remove-fps-display.md
      - Bot Stops Casting: EQ2/getting-started/bot-stops-casting.md
